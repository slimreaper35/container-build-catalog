---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deploy-sigstore
spec:
  description: |
    Deploys the Sigstore stack on the test cluster using the sigstore scaffold Helm chart,
    so that the keyless signing support of the buildah task can be exercised by the e2e suite.
  params:
    - name: cluster-access-secret-name
      type: string
      description: "The name of the secret containing the kubeconfig to access the target cluster."
  volumes:
    - name: cluster-secret-volume
      secret:
        secretName: $(params.cluster-access-secret-name)
  steps:
    - name: deploy-sigstore
      image: quay.io/konflux-ci/task-runner:4.0.0@sha256:ab7440e1101af1ff0418e16badede2f1590664d3189099030bf3f782371bd9da
      computeResources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: 1
          memory: 2Gi
      volumeMounts:
        - name: cluster-secret-volume
          mountPath: /tmp/kubeconfig
          subPath: kubeconfig
      env:
        - name: KUBECONFIG
          value: /tmp/kubeconfig
        - name: HELM_CACHE_HOME
          value: /tmp/helm/cache
        - name: HELM_CONFIG_HOME
          value: /tmp/helm/config
        - name: HELM_DATA_HOME
          value: /tmp/helm/data
      script: |
        #!/bin/bash
        set -euo pipefail

        # TODO: Add helm to the task-runner image.
        HELM_VERSION=v3.21.4
        case "$(uname -m)" in
            x86_64)  HELM_ARCH=amd64 ;;
            aarch64) HELM_ARCH=arm64 ;;
            *)       echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
        esac
        HELM_TARBALL="helm-${HELM_VERSION}-linux-${HELM_ARCH}.tar.gz"

        curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors \
            -o "/tmp/${HELM_TARBALL}" \
            "https://get.helm.sh/${HELM_TARBALL}"

        mkdir -p /tmp/bin
        tar -xzf "/tmp/${HELM_TARBALL}" --strip-components=1 -C /tmp/bin "linux-${HELM_ARCH}/helm"
        export PATH="/tmp/bin:${PATH}"

        SIGSTORE_DIR=/tmp/sigstore
        mkdir -p "${SIGSTORE_DIR}"
        for file in install.sh values.yaml; do
            curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors \
                -o "${SIGSTORE_DIR}/${file}" \
                "https://raw.githubusercontent.com/konflux-ci/konflux-ci/main/integrations/sigstore/${file}"
        done

        if ! grep -q 'enableKeylessSigning: true' "${SIGSTORE_DIR}/install.sh"; then
            echo "konflux-ci install.sh no longer sets enableKeylessSigning: true" >&2
            exit 1
        fi
        sed -i 's/enableKeylessSigning: true/enableKeylessSigning: false/' "${SIGSTORE_DIR}/install.sh"

        if ! grep -q '^# Configure Tekton Chains' "${SIGSTORE_DIR}/install.sh"; then
            echo "konflux-ci install.sh no longer has a Tekton Chains section to skip" >&2
            exit 1
        fi
        sed '/^# Configure Tekton Chains/,$d' "${SIGSTORE_DIR}/install.sh" > "${SIGSTORE_DIR}/deploy.sh"

        bash "${SIGSTORE_DIR}/deploy.sh"
